name: Postman Inwarrenty Flow Practice

on:
  push:
    branches: [main]
  workflow_dispatch: 
  schedule:
    - cron: "30 8 * * *"

jobs:
  run-postman-tests:
    runs-on: self-hosted

  steps:
    - name: Checkout
      uses: actions/checkout@v7.0.0

    - name: Install Node.js and npm
      uses: actions/setup-node@v3.9.1
      with:
          node-version: '22'

    - name: Install Newman and HTML Extra globally
      run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

    - name: Run the Postman collection with Newman
      run: |
          newman run 'Inwarranty-Flow Collection CSVFile.postman_collection.json' \
            -e QA.postman_environment.json \
            -d testdata.csv \
            -r cli,htmlextra \
            --reporter-htmlextra-export ./newman/index.html

    - name: Newman Report
      if: always() # ensure that the archive executed irrespective whether the previous step has passed or not 
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Newman Report
          path: newman/*.html   
        









     
